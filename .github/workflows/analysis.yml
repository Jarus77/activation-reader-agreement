name: Reproduce saved analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -v
      - run: python analyze_sae.py
      - run: python analyze_prompt_overlap.py
      - run: python render_agreement_tables.py
      - run: python render_findings.py
